<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login and Signup</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at center,#140021,#05000a);
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
    color:#fff;
}

/* Purple Rays Background */
body::before {
    content:"";
    position:absolute;
    z-index: -2; /* PUSHES WAY TO THE BACK */
    width:200%;
    height:200%;
    background:conic-gradient(from 0deg, rgba(170,0,255,0.08), transparent 40%);
    animation:rotate 20s linear infinite;
}

@keyframes rotate { 100%{transform:rotate(360deg);} }

/* Floating Purple Particles */
body::after {
    content:"";
    position:absolute;
    z-index: -1; /* PUSHES WAY TO THE BACK */
    width:100%;
    height:100%;
    background-image:radial-gradient(rgba(200,0,255,0.4) 1px, transparent 1px);
    background-size:50px 50px;
    opacity:0.2;
    animation:float 10s infinite linear;
}

@keyframes float { from{transform:translateY(0);} to{transform:translateY(-50px);} }

/* Vault Card */
.card {
    position:relative;
    z-index: 999; /* PULLS TO THE VERY FRONT */
    width:480px;
    padding:70px 60px;
    background:linear-gradient(145deg,#1a002b,#12001f);
    border-radius:20px;
    box-shadow: 0 0 60px rgba(170,0,255,0.2), inset 0 0 30px rgba(170,0,255,0.15);
    border:1px solid rgba(200,0,255,0.5);
    backdrop-filter:blur(5px);
    animation:fadeUp 1.5s ease forwards;
}

@keyframes fadeUp { from{opacity:0; transform:translateY(50px);} to{opacity:1; transform:translateY(0);} }

/* Animated Border Glow */
.card::before {
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:20px;
    background:linear-gradient(120deg, transparent, rgba(200,0,255,0.9), transparent);
    background-size:300%;
    animation:borderMove 6s linear infinite;
    z-index:-1;
}

@keyframes borderMove { 0%{background-position:0%} 100%{background-position:300%} }

h2 {
    font-family:'Cinzel',serif;
    text-align:center;
    color:#d580ff;
    margin-bottom:30px; 
    letter-spacing:3px;
    font-size:28px;
}

.input-group { margin-bottom:35px; }

/* MADE INPUTS RELATIVE TO GUARANTEE CLICKABILITY */
input {
    position: relative;
    z-index: 1000;
    width:100%;
    padding:15px;
    background:#0b0014;
    border:1px solid rgba(200,0,255,0.4);
    color:#fff;
    border-radius:8px;
    outline:none;
    transition:0.4s;
}

input:focus {
    box-shadow:0 0 20px rgba(200,0,255,0.8);
    border:1px solid #d580ff;
}

button {
    position: relative;
    z-index: 1000;
    width:100%;
    padding:16px;
    border:none;
    background:linear-gradient(90deg,#6a00ff,#c000ff,#6a00ff);
    background-size:200%;
    color:#fff;
    font-weight:600;
    letter-spacing:2px;
    cursor:pointer;
    border-radius:8px;
    transition:0.4s;
}

button:hover {
    background-position:right;
    box-shadow:0 0 40px rgba(200,0,255,0.9);
}

.lock {
    text-align:center;
    font-size:40px;
    margin-bottom:20px;
    color:#d580ff;
    animation:pulse 2s infinite ease-in-out;
}

@keyframes pulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }

.footer {
    position: relative;
    z-index: 1000;
    margin-top:30px;
    text-align:center;
    font-size:13px;
    color:#b77edb;
}
</style>
</head>

<body>

<div class="card">
    <div class="lock">🔐</div>
    <h2>Welcome !</h2>
    
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div style="color: #ff6680; text-align: center; margin-bottom: 25px; font-weight: 500; text-shadow: 0 0 10px rgba(255,102,128,0.5);">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
        </div>
    {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="input-group">
            <input type="email" name="email" placeholder="Member ID (Email)" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="Secure Key" required>
        </div>
        <button type="submit">Login</button>
    </form>

    <div class="footer">Confidential Executive Portal<br>
        <a href="/register" style="color: #d580ff; text-decoration: none; font-size: 11px; margin-top: 10px; display: inline-block;">Need Access? Register Here</a>
    </div>
</div>

</body>
</html>
