
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor - CodeCompiler</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="stylesheet" href="style.css?v=webdev_engine_v1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

    <style>
        /* Home Button Style */
        #home-btn {
            background: linear-gradient(45deg, #621b91, #232f96);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #home-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(157, 0, 255, 0.8), 0 0 30px rgba(157, 0, 255, 0.35);
        }

        /* NEW: Download Button Style */
        #download-btn {
            background: linear-gradient(45deg, #8f28b8, #0072ff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-left: 10px;
        }
        #download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(157, 0, 255, 0.8), 0 0 30px rgba(157, 0, 255, 0.35);
        }

        /* Clear Button Header Styles */
        
        
        .clear-btn {
            background: linear-gradient(45deg, #804ea1, #a70da1);
            color: #ccc;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .clear-btn:hover {
            background: linear-gradient(45deg, #be0e0e, #ff3333);
            color: white;
            box-shadow: 0 0 12px rgba(190, 14, 14, 0.7);
            transform: scale(1.05);
        }
    </style>

    <!-- CodeMirror for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <!-- Marked.js for streaming markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        .CodeMirror { height: 100%; font-family: 'Consolas', monospace; font-size: 14px; border-radius: 8px; }
      .cm-s-monokai.CodeMirror { background-color: #0b0f19 !important; }
      .cm-s-monokai .CodeMirror-gutters { background-color: #0b0f19 !important; border-right: 1px solid #1e2532 !important; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><span>&lt;/&gt;</span> Code Compiler</div>
        <div class="header-actions" style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
            <button id="home-btn" onclick="window.location.href='index.html'">Home</button>
            
        </div>
    </div>

    <div class="language-tabs">
        <button class="lang-tab" data-lang="python" onclick="switchLanguage('python')">Python</button>
        <button class="lang-tab" data-lang="cpp" onclick="switchLanguage('cpp')">C++</button>
        <button class="lang-tab" data-lang="java" onclick="switchLanguage('java')">Java</button>
        <button class="lang-tab" data-lang="c" onclick="switchLanguage('c')">C</button>
        <button class="lang-tab" data-lang="sql" onclick="switchLanguage('sql')">SQL</button>
        <div style="width: 1px; height: 20px; background: var(--border); margin: 0 10px;"></div>
        <button class="lang-tab" data-lang="webdev" id="webdev-tab" onclick="enterWebDevMode()">Web</button>
    
        <div style="margin-left: auto; display: flex; align-items: center; padding-right: 15px;">
            <label class="theme-switch" for="theme-checkbox">
                <input type="checkbox" id="theme-checkbox" onchange="toggleTheme()">
                <div class="theme-slider">
                    <span class="theme-text theme-text-left">DARK<br>MODE</span>
                    <span class="theme-text theme-text-right">LIGHT<br>MODE</span>
                    <div class="theme-thumb">
                        <span class="theme-icon theme-icon-moon">🌙</span>
                        <span class="theme-icon theme-icon-sun">☀️</span>
                    </div>
                </div>
            </label>
        </div>
    </div>

    <!-- ======= WEB DEV MODE PANEL (HTML/CSS/JS only) ======= -->
    <div id="webdev-panel" style="display:none; flex: 1; overflow: hidden; display: none; flex-direction: row;">
        <!-- File Sidebar -->
        <div id="file-sidebar" style="width: 130px; flex-shrink: 0; background: #0b0f19; border-right: 1px solid #1e2532; display: flex; flex-direction: column; overflow-y: auto;">
            <div style="padding: 8px 10px; font-size: 11px; color: #6b7a94; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #1e2532; display: flex; justify-content: space-between; align-items: center;">
                <span>Files</span>
                <button onclick="addWebFile()" title="Add new file" style="background: none; border: none; color: #00f5ff; font-size: 16px; cursor: pointer; padding: 0; line-height: 1;">+</button>
            </div>
            <div id="file-list"></div>
        </div>

        <!-- Web Editor Area -->
        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <!-- Web File Tabs -->
            <div id="web-file-tabs" style="display: flex; align-items: center; background: #111725; border-bottom: 1px solid #1e2532; min-height: 36px; overflow-x: auto; flex-shrink: 0;"></div>
            <!-- Web Toolbar -->
            <div style="background: #0b0f19; padding: 8px 15px; border-bottom: 1px solid #1e2532; display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                <button class="run-btn" onclick="runCode()" style="padding: 6px 16px;">▶ Run</button>
                <button id="ai-btn-web" class="run-btn" onclick="askAI()" style="background: linear-gradient(90deg, #ff007f, #7f00ff); padding: 6px 16px;">✨ Ask AI</button>
                <label style="color: #6b7a94; font-size: 12px; margin-left: auto;">Live Preview</label>
                <input type="checkbox" id="live-preview-toggle" checked onchange="toggleLivePreview()" style="cursor: pointer;">
            </div>
            <!-- The Web CodeMirror Editor -->
            <div style="flex: 1; overflow: hidden; position: relative;">
                <textarea id="web-code-editor" spellcheck="false"></textarea>
            </div>
        </div>

        <!-- Web Resizer -->
        <div id="web-resizer" style="width: 6px; flex-shrink: 0; background: #111725; border-left: 1px solid #1e2532; cursor: col-resize;"></div>

        <!-- Web Preview Panel -->
        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <!-- Browser / Console tabs -->
            <div style="display: flex; align-items: center; background: #111725; border-bottom: 1px solid #1e2532; min-height: 36px; flex-shrink: 0;">
                <button id="tab-browser" onclick="switchPreviewTab('browser')" style="padding: 8px 16px; background: none; border: none; border-bottom: 2px solid #00f5ff; color: #00f5ff; cursor: pointer; font-size: 13px; font-weight: 600;">🌐 Browser</button>
                <button id="tab-console" onclick="switchPreviewTab('console')" style="padding: 8px 16px; background: none; border: none; border-bottom: 2px solid transparent; color: #6b7a94; cursor: pointer; font-size: 13px;">⬛ Console</button>
            </div>
            <!-- Iframe Preview -->
            <iframe id="web-preview" style="flex: 1; width: 100%; border: none; background: white;"></iframe>
            <!-- Console Output -->
            <div id="web-console" style="display: none; flex: 1; background: #0b0f19; color: #ccc; font-family: Consolas, monospace; font-size: 13px; padding: 10px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- ======= NORMAL COMPILER MODE (Python/C++/Java/C/SQL) ======= -->
    <div id="compiler-panel" class="main-container">
        <div class="editor-section">
            <div class="toolbar">
                <button class="run-btn" id="run-btn" onclick="runCode()">▶ Run</button>
                <button id="download-btn" onclick="downloadCode()">⬇ Download</button>
                <button id="ai-btn" class="run-btn" onclick="askAI()" style="margin-left: 10px; background: linear-gradient(90deg, #ff007f, #7f00ff);">✨ Ask AI</button>
            </div>
            <textarea id="code-editor" spellcheck="false" placeholder="Write your code here..."></textarea>
        </div>

        <div class="resizer" id="resizer"><div style="height: 56px; border-bottom: 1px solid var(--border); box-sizing: border-box; width: 100%;"></div></div>
        <div class="output-section">
            <div class="output-header">
                <span class="output-title" style="font-weight: 600; font-size: 14px; color: var(--cyan);">Output Terminal</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="run-btn" id="stop-btn" onclick="stopExecution()" style="display: none; background: linear-gradient(90deg, #ff3333, #be0e0e); box-shadow: 0 0 12px rgba(255, 51, 51, 0.6); padding: 8px 16px; font-size: 13px;">Stop ⏹️</button>
                    <button class="clear-btn" onclick="clearOutput()" style="padding: 8px 16px; font-size: 13px;">Clear</button>
                </div>
            </div>
            <div id="terminal-container" style="height: 100%; width: 100%; padding: 10px 0 10px 10px; background: transparent;"></div>
        </div>
    </div>

    
    <!-- AI Modal -->
    <div id="ai-modal" style="display: none; position: fixed; bottom: 20px; right: 20px; width: 450px; max-height: 80vh; background: #111725; border: 1px solid #9d00ff; border-radius: 10px; box-shadow: 0 0 20px rgba(157, 0, 255, 0.4); color: white; flex-direction: column; z-index: 1000; overflow: hidden; resize: both;">
        <div id="ai-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #263449; padding: 12px 15px; background: linear-gradient(90deg, #1e2532, #111725); cursor: grab;">
            <h3 style="margin: 0; color: #00f5ff; font-size: 16px; text-shadow: 0 0 8px rgba(0, 245, 255, 0.6); pointer-events: none;">✨ AI Code Assistant</h3>
            <button id="ai-close-btn" onclick="document.getElementById('ai-modal').style.display='none'" style="background: transparent; border: none; color: white; font-size: 16px; cursor: pointer;">✖</button>
        </div>
        
        <div id="ai-response" style="flex: 1; overflow-y: auto; padding: 15px; font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.5; font-size: 14px;">
            How can I help you with your code today?
        </div>
        
        <!-- Context Attachment UI (Card Format) -->
        <div id="ai-attachment-container" style="padding: 10px 15px 0 15px; background: #0b0f19; display: none;">
            <div id="ai-attached-file" style="position: relative; width: 90px; height: 90px; background: #2a2a2a; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <img id="ai-attachment-icon" src="" style="width: 24px; height: 24px; border-radius: 4px;" alt="Language Icon">
                    <button onclick="removeAttachment()" style="background: white; color: black; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; line-height: 1;">✖</button>
                </div>
                <div id="ai-attachment-text" style="color: white; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Segoe UI', Tahoma, sans-serif;">code.py</div>
            </div>
        </div>

        <div id="ai-input-container" style="padding: 15px; background: #0b0f19;">
            <textarea id="ai-prompt" placeholder="Ask AI to write code, find errors, or explain concepts..." style="width: 100%; height: 60px; background: #1e2532; border: 1px solid #3d4b63; border-radius: 6px; color: white; padding: 10px; box-sizing: border-box; font-family: inherit; resize: none; margin-bottom: 10px;"></textarea>
            <div style="display: flex; justify-content: flex-end;">
                <button class="run-btn" onclick="sendToAI()" style="padding: 6px 15px; font-size: 13px;">Send 🚀</button>
            </div>
        </div>
    </div>
<script>
        
        
        // --- Resizer Logic ---
        const resizer = document.getElementById('resizer');
        const leftSide = document.querySelector('.editor-section');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none'; // Prevent text selection
            leftSide.style.pointerEvents = 'none'; // Prevent iframe/editor from stealing mouse events
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerOffsetLeft = leftSide.parentElement.offsetLeft;
            const pointerRelativeXpos = e.clientX - containerOffsetLeft;
            const containerWidth = leftSide.parentElement.clientWidth;
            
            const cssTab = document.querySelector('.lang-tab[data-lang="css"]');
            const minWidth = cssTab ? cssTab.offsetLeft : 50; // Stop exactly at CSS tab boundary
            if (pointerRelativeXpos > minWidth && pointerRelativeXpos < containerWidth - minWidth) {
                leftSide.style.flex = 'none';
                leftSide.style.width = pointerRelativeXpos + 'px';
                if (typeof fitAddon !== 'undefined') {
                    fitAddon.fit();
                }
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                document.body.style.userSelect = ''; // Restore text selection
                leftSide.style.pointerEvents = 'auto';
                if (typeof fitAddon !== 'undefined') {
                    fitAddon.fit();
                }
            }
        });

        // --- Theme Logic ---
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeUI(isLight);
        }

        function updateThemeUI(isLight) {
            const checkbox = document.getElementById('theme-checkbox');
            if (checkbox) checkbox.checked = isLight;
            
            // Update CodeMirror
            editor.setOption('theme', isLight ? 'default' : 'monokai');
            
            // Update Terminal
            term.options.theme = isLight 
                ? { background: '#ffffff', foreground: '#1e293b', cursor: '#1e293b' } 
                : { background: '#000000', foreground: '#ffffff', cursor: '#ffffff' };
        }

        // Initialize Theme on Load
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            // We call updateThemeUI(true) slightly later because term/editor might not be fully ready here
            setTimeout(() => updateThemeUI(true), 50);
        }
        
        // --- CodeMirror Initialization ---
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            lineNumbers: true,
            mode: 'python',
            theme: 'monokai',
            autoCloseBrackets: true
        });

        const langModes = {
            python: 'python',
            cpp: 'text/x-c++src',
            c: 'text/x-csrc',
            java: 'text/x-java',
            sql: 'text/x-sql',
            html: 'xml',
            css: 'css',
            js: 'javascript'
        };

        const defaultCode = {
            python: "print('Hello, World!')",
            cpp: "#include <iostream>\n\nint main() {\n    std::cout << \"Hello, World!\";\n    return 0;\n}",
            c: "#include <stdio.h>\n\nint main() {\n    printf(\"Hello, World!\");\n    return 0;\n}",
            java: "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    }\n}",
            html: "<!DOCTYPE html>\n<html>\n<head>\n    <title>Test</title>\n</head>\n<body>\n    <h1>Hello World</h1>\n</body>\n</html>",
            css: "body {\n    background-color: #2b2b2b;\n    color: white;\n}",
            js: "console.log('Hello from JS!');",
            sql: "-- Write your SQL queries here\nCREATE TABLE users (id INT, name VARCHAR(50));\nINSERT INTO users VALUES (1, 'Alice');\nSELECT * FROM users;"
        };

        const languageNames = {
            python: 'Python', cpp: 'C++', c: 'C', java: 'Java', sql: 'SQL', html: 'HTML', css: 'CSS', js: 'JS'
        };

        function switchLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            
            // Exit web dev mode if coming from it
            if (isWebDevMode) {
                exitWebDevMode();
            }

            // Highlight active tab
            document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.querySelector(`.lang-tab[data-lang="${lang}"]`);
            if (activeTab) activeTab.classList.add('active');
            
            // Set Mode (use fallback to 'python' if undefined)
            editor.setOption('mode', langModes[lang] || 'python');

            // Try to load saved code from local storage
            const savedCode = localStorage.getItem('code_' + lang);
            if (savedCode) {
                editor.setValue(savedCode);
            } else {
                editor.setValue(defaultCode[lang] || "");
            }
        }

        // Auto-save feature
        editor.on('change', () => {
            const lang = localStorage.getItem('selectedLanguage') || 'python';
            localStorage.setItem('code_' + lang, editor.getValue());
        });

        // Initialize on load
        const savedLang = localStorage.getItem('selectedLanguage') || 'python';
        switchLanguage(savedLang);

        // --- Terminal Initialization ---
        const term = new Terminal({
            theme: { background: '#000000' },
            fontFamily: 'Consolas, monospace',
            fontSize: 14,
            cursorBlink: true
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        let currentWs = null;

        function runCode() {
            if (currentWs) return; // already running

            const lang = localStorage.getItem('selectedLanguage') || 'python';
            const code = editor.getValue();
            
            // Save current code immediately
            localStorage.setItem('code_' + lang, code);

            if (lang === 'webdev' || isWebDevMode) {
                renderWebPreview();
                return;
            }
            
            term.clear();
            term.write('\x1b[36mConnecting to server...\x1b[0m\r\n');
            
            // Toggle Buttons
            
            document.getElementById('stop-btn').style.display = 'inline-block';

            const ws = new WebSocket('wss://online-compiler-1-5f6k.onrender.com/ws/run');
            currentWs = ws;

            ws.onopen = () => {
                ws.send(JSON.stringify({ language: lang, code: code }));
            };

            ws.onmessage = (event) => {
                term.write(event.data);
            };

            ws.onclose = () => {
                term.write('\r\n\x1b[33mConnection closed.\x1b[0m\r\n');
                currentWs = null;
                
                document.getElementById('stop-btn').style.display = 'none';
            };

            ws.onerror = (err) => {
                term.write('\r\n\x1b[31mWebSocket Error.\x1b[0m\r\n');
            };

            term.onData((data) => {
                if (currentWs && currentWs.readyState === WebSocket.OPEN) {
                    currentWs.send(data);
                }
            });
        }

        function stopExecution() {
            if (currentWs && currentWs.readyState === WebSocket.OPEN) {
                currentWs.send('{"command": "stop"}');
            }
        }

        function clearOutput() {
            term.clear();
            term.write('Terminal cleared.\r\n');
        }

        function downloadCode() {
            const lang = localStorage.getItem('selectedLanguage') || 'python';
            const ext = {python:'py', cpp:'cpp', java:'java', c:'c', html:'html', css:'css'}[lang] || 'txt';
            const blob = new Blob([editor.getValue()], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `code.${ext}`;
            a.click();
        }

        window.addEventListener('resize', () => {
            fitAddon.fit();
        });
        

        // =========================================================
        // WEB DEV MODE — Multi-file editor (HTML/CSS/JS only)
        // =========================================================
        
        let webFiles = {};
        let activeWebFile = 'index.html';
        let webEditor = null;
        let livePreviewEnabled = true;
        let previewDebounceTimer = null;
        let isWebDevMode = false;

        const webFileDefaults = {
            'index.html': `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello, World!</h1>
    <p>Edit HTML, CSS and JS files and see live preview.</p>
    <script src="script.js"><\/script>
</body>
</html>`,
            'style.css': `body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    color: #333;
    padding: 30px;
}

h1 {
    color: #5a00cc;
}`,
            'script.js': `// JavaScript is linked via script.js
console.log('Hello from script.js!');

document.addEventListener('DOMContentLoaded', () => {
    console.log('Page loaded!');
});`
        };

        const webFileModes = {
            'html': 'xml',
            'css': 'css',
            'js': 'javascript',
            'ts': 'javascript',
            'json': 'javascript',
            'sql': 'text/x-sql',
            'txt': null
        };

        function getFileModeFromName(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return webFileModes[ext] || 'xml';
        }

        function enterWebDevMode() {
            isWebDevMode = true;
            localStorage.setItem('selectedLanguage', 'webdev');

            // Show/hide panels
            document.getElementById('compiler-panel').style.display = 'none';
            const webPanel = document.getElementById('webdev-panel');
            webPanel.style.display = 'flex';

            // Highlight the tab
            document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
            const wt = document.getElementById('webdev-tab');
            if (wt) wt.classList.add('active');

            // Initialize webEditor if not done yet
            if (!webEditor) {
                webEditor = CodeMirror.fromTextArea(document.getElementById('web-code-editor'), {
                    lineNumbers: true,
                    theme: document.body.classList.contains('light-mode') ? 'default' : 'monokai',
                    autoCloseBrackets: true,
                    mode: 'xml'
                });
                webEditor.setSize('100%', '100%');
                webEditor.on('change', () => {
                    // Save current file content
                    webFiles[activeWebFile] = webEditor.getValue();
                    if (livePreviewEnabled) {
                        clearTimeout(previewDebounceTimer);
                        previewDebounceTimer = setTimeout(renderWebPreview, 300);
                    }
                });
            }

            // Load default files if not already loaded
            if (Object.keys(webFiles).length === 0) {
                for (const [name, code] of Object.entries(webFileDefaults)) {
                    const saved = localStorage.getItem('webfile_' + name);
                    webFiles[name] = saved !== null ? saved : code;
                }
            }

            buildFileSidebar();
            buildFileTabs();
            openWebFile('index.html');
            renderWebPreview();

            // Web resizer logic
            initWebResizer();
        }

        function exitWebDevMode() {
            isWebDevMode = false;
            document.getElementById('webdev-panel').style.display = 'none';
            document.getElementById('compiler-panel').style.display = 'flex';
        }

        function buildFileSidebar() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            for (const name of Object.keys(webFiles)) {
                const row = document.createElement('div');
                row.id = 'sidebar-file-' + name;
                row.innerText = name;
                row.title = name;
                row.style.cssText = `padding: 7px 12px; font-size: 12px; cursor: pointer; color: #a8b2c1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.15s;`;
                row.onclick = () => openWebFile(name);
                row.onmouseenter = () => { if (activeWebFile !== name) row.style.background = '#1e2532'; };
                row.onmouseleave = () => { if (activeWebFile !== name) row.style.background = ''; };
                if (name === activeWebFile) {
                    row.style.background = '#1e2532';
                    row.style.color = '#00f5ff';
                    row.style.borderLeft = '2px solid #00f5ff';
                }
                list.appendChild(row);
            }
        }

        function buildFileTabs() {
            const bar = document.getElementById('web-file-tabs');
            bar.innerHTML = '';
            for (const name of Object.keys(webFiles)) {
                const tab = document.createElement('div');
                tab.id = 'filetab-' + name;
                const isActive = name === activeWebFile;
                tab.style.cssText = `display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; color: ${isActive ? '#00f5ff' : '#a8b2c1'}; border-bottom: 2px solid ${isActive ? '#00f5ff' : 'transparent'}; white-space: nowrap; background: ${isActive ? '#0b0f19' : 'transparent'}; flex-shrink: 0;`;
                tab.onclick = () => openWebFile(name);

                const label = document.createElement('span');
                label.innerText = name;
                label.style.pointerEvents = 'none';

                const closeBtn = document.createElement('button');
                closeBtn.innerText = '✕';
                closeBtn.title = 'Close ' + name;
                closeBtn.style.cssText = `background: none; border: none; color: #6b7a94; cursor: pointer; font-size: 11px; padding: 0; line-height: 1; display: flex; align-items: center;`;
                closeBtn.onclick = (e) => { e.stopPropagation(); closeWebFile(name); };

                tab.appendChild(label);
                tab.appendChild(closeBtn);
                bar.appendChild(tab);
            }
        }

        function openWebFile(name) {
            // Save current before switching
            if (webEditor && activeWebFile) {
                webFiles[activeWebFile] = webEditor.getValue();
                saveWebFiles();
            }
            activeWebFile = name;

            webEditor.setValue(webFiles[name] || '');
            webEditor.setOption('mode', getFileModeFromName(name));
            webEditor.refresh();

            buildFileSidebar();
            buildFileTabs();
        }

        function closeWebFile(name) {
            const keys = Object.keys(webFiles);
            if (keys.length === 1) {
                alert('You must have at least one file open!');
                return;
            }
            delete webFiles[name];
            localStorage.removeItem('webfile_' + name);

            // Switch to first remaining file
            if (activeWebFile === name) {
                const remaining = Object.keys(webFiles);
                activeWebFile = remaining[0];
                webEditor.setValue(webFiles[activeWebFile] || '');
                webEditor.setOption('mode', getFileModeFromName(activeWebFile));
            }
            buildFileSidebar();
            buildFileTabs();
            renderWebPreview();
        }

        function addWebFile() {
            const name = prompt('Enter filename (e.g. utils.js, about.html, theme.css):');
            if (!name || !name.trim()) return;
            const trimmed = name.trim();
            if (webFiles[trimmed] !== undefined) {
                alert('A file with that name already exists!');
                return;
            }
            webFiles[trimmed] = '';
            buildFileSidebar();
            buildFileTabs();
            openWebFile(trimmed);
        }

        function saveWebFiles() {
            for (const [name, code] of Object.entries(webFiles)) {
                localStorage.setItem('webfile_' + name, code);
            }
        }

        function renderWebPreview() {
            if (webEditor && activeWebFile) {
                webFiles[activeWebFile] = webEditor.getValue();
                saveWebFiles();
            }

            const htmlFile = webFiles['index.html'] || Object.values(webFiles)[0] || '';
            const cssFiles = Object.entries(webFiles).filter(([n]) => n.endsWith('.css'));
            const jsFiles = Object.entries(webFiles).filter(([n]) => n.endsWith('.js'));

            let cssInline = cssFiles.map(([, code]) => `<style>${code}</style>`).join('\n');
            let jsInline  = jsFiles.map(([, code]) => `<script>${code}<\/script>`).join('\n');

            // Parse HTML and inject CSS/JS in place of link/script tags
            let combined = htmlFile;
            cssFiles.forEach(([name, code]) => {
                combined = combined.replace(new RegExp(`<link[^>]*href=["']${name}["'][^>]*>`, 'gi'), `<style>${code}</style>`);
            });
            jsFiles.forEach(([name, code]) => {
                combined = combined.replace(new RegExp(`<script[^>]*src=["']${name}["'][^>]*>\s*<\/script>`, 'gi'), `<script>${code}<\/script>`);
            });

            // Inject console capture
            const consoleCapture = `<script>
                (function() {
                    var origLog = console.log, origErr = console.error, origWarn = console.warn;
                    function send(type, args) {
                        window.parent.postMessage({ type: 'console', level: type, msg: Array.from(args).map(String).join(' ') }, '*');
                    }
                    console.log = function() { origLog.apply(console,arguments); send('log', arguments); };
                    console.error = function() { origErr.apply(console,arguments); send('error', arguments); };
                    console.warn = function() { origWarn.apply(console,arguments); send('warn', arguments); };
                    window.addEventListener('error', function(e) { send('error', [e.message]); });
                })();
            <\/script>`;

            combined = combined.replace('<head>', '<head>' + consoleCapture);

            const iframe = document.getElementById('web-preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(combined);
            doc.close();
        }

        // Listen for console messages from the iframe
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'console') {
                const colors = { log: '#ccc', error: '#ff4444', warn: '#ffbb00' };
                const icons  = { log: '›', error: '✕', warn: '⚠' };
                const div = document.getElementById('web-console');
                const line = document.createElement('div');
                line.style.cssText = `padding: 3px 0; border-bottom: 1px solid #1e2532; color: ${colors[e.data.level] || '#ccc'};`;
                line.innerText = `${icons[e.data.level] || '>'} ${e.data.msg}`;
                div.appendChild(line);
                div.scrollTop = div.scrollHeight;
            }
        });

        function switchPreviewTab(tab) {
            const iframe = document.getElementById('web-preview');
            const consoleDiv = document.getElementById('web-console');
            const tabBrowser = document.getElementById('tab-browser');
            const tabConsole = document.getElementById('tab-console');

            if (tab === 'browser') {
                iframe.style.display = 'block';
                consoleDiv.style.display = 'none';
                tabBrowser.style.borderBottomColor = '#00f5ff';
                tabBrowser.style.color = '#00f5ff';
                tabConsole.style.borderBottomColor = 'transparent';
                tabConsole.style.color = '#6b7a94';
            } else {
                iframe.style.display = 'none';
                consoleDiv.style.display = 'block';
                tabBrowser.style.borderBottomColor = 'transparent';
                tabBrowser.style.color = '#6b7a94';
                tabConsole.style.borderBottomColor = '#00f5ff';
                tabConsole.style.color = '#00f5ff';
            }
        }

        function toggleLivePreview() {
            livePreviewEnabled = document.getElementById('live-preview-toggle').checked;
        }

        // Web Resizer Logic
        function initWebResizer() {
            const wr = document.getElementById('web-resizer');
            if (!wr || wr._initialized) return;
            wr._initialized = true;
            let isWResizing = false;
            wr.addEventListener('mousedown', () => {
                isWResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });
            document.addEventListener('mousemove', (e) => {
                if (!isWResizing) return;
                const panel = document.getElementById('webdev-panel');
                const rect = panel.getBoundingClientRect();
                const left = e.clientX - rect.left;
                const min = 200;
                if (left > min && left < rect.width - min) {
                    const leftEditorEl = wr.previousElementSibling;
                    leftEditorEl.style.flex = 'none';
                    leftEditorEl.style.width = left + 'px';
                    if (webEditor) webEditor.refresh();
                }
            });
            document.addEventListener('mouseup', () => {
                if (isWResizing) {
                    isWResizing = false;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    if (webEditor) webEditor.refresh();
                }
            });
        }

        // On page load: if last session was webdev mode, enter it
        (function() {
            const sl = localStorage.getItem('selectedLanguage');
            if (sl === 'webdev') {
                enterWebDevMode();
            }
        })();

        // --- AI Assistant Logic ---
        
        dragElement(document.getElementById("ai-modal"));
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            if (document.getElementById("ai-header")) {
                document.getElementById("ai-header").onmousedown = dragMouseDown;
            } else {
                elmnt.onmousedown = dragMouseDown;
            }
            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.bottom = "auto";
                elmnt.style.right = "auto";
            }
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        let attachedCodeContext = "";

        function askAI() {
            document.getElementById('ai-modal').style.display = 'flex';
            
            const selectedText = editor.getSelection();
            const attachContainer = document.getElementById('ai-attachment-container');
            const attachText = document.getElementById('ai-attachment-text');
            const iconImg = document.getElementById('ai-attachment-icon');
            
            const language = localStorage.getItem('selectedLanguage') || 'python';
            const ext = {python:'py', cpp:'cpp', java:'java', c:'c', html:'html', css:'css'}[language] || 'txt';
            
            const iconMap = {
                python: 'python/python-original.svg',
                java: 'java/java-original.svg',
                cpp: 'cplusplus/cplusplus-original.svg',
                c: 'c/c-original.svg',
                sql: 'mysql/mysql-original.svg',
                html: 'html5/html5-original.svg',
                css: 'css3/css3-original.svg',
                js: 'javascript/javascript-original.svg'
            };
            const iconPath = iconMap[language] || 'javascript/javascript-original.svg';
            if (iconImg) iconImg.src = `https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/${iconPath}`;

            if (selectedText.trim()) {
                attachedCodeContext = selectedText;
                attachText.innerText = "code." + ext;
                attachContainer.style.display = 'block';
            } else if (editor.getValue().trim()) {
                attachedCodeContext = editor.getValue();
                attachText.innerText = "code." + ext;
                attachContainer.style.display = 'block';
            } else {
                attachedCodeContext = "";
                attachContainer.style.display = 'none';
            }

            if (document.getElementById('ai-response').innerText.includes("How can I help you")) {
                document.getElementById('ai-prompt').focus();
            }
        }

        function removeAttachment() {
            attachedCodeContext = "";
            document.getElementById('ai-attachment-container').style.display = 'none';
        }

        // Configure Marked.js with custom renderer for copying code
        if (typeof marked !== 'undefined') {
            const renderer = new marked.Renderer();
            renderer.code = function({text, lang}) {
                const encodedCode = encodeURIComponent(text);
                const safeCode = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<div style="background: #1e2532; border-radius: 8px; margin: 15px 0; border: 1px solid #3d4b63; overflow: hidden;">
                           <div style="background: #111725; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d4b63;">
                           <span style="color: #a8b2c1; font-size: 13px; font-weight: bold;">&lt;/&gt; ${lang || 'Code'}</span>
                           <div>
                           <button class="ai-copy-btn" onclick="navigator.clipboard.writeText(decodeURIComponent('${encodedCode}'))">📋 Copy</button>
                           <button class="ai-insert-btn" onclick="editor.replaceSelection(decodeURIComponent('${encodedCode}')); document.getElementById('ai-modal').style.display='none';">▶ Insert</button>
                           </div></div>
                           <pre style="margin: 0; padding: 15px; color: #00f5ff; font-family: 'Consolas', monospace; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;"><code>${safeCode}</code></pre>
                        </div>`;
            };
            marked.use({ renderer });
        }

        async function sendToAI() {
            const prompt = document.getElementById('ai-prompt').value;
            const language = localStorage.getItem('selectedLanguage') || 'python';
            const responseDiv = document.getElementById('ai-response');
            
            if (!attachedCodeContext.trim() && !prompt.trim()) {
                alert("Please provide some code in the editor or type a question!");
                return;
            }

            responseDiv.innerHTML = '<span style="color: #9d00ff;">Thinking... ⏳</span>';
            document.getElementById('ai-prompt').value = '';
            
            const codeToSend = attachedCodeContext;
            document.getElementById('ai-attachment-container').style.display = 'none';
            attachedCodeContext = "";

            try {
                const response = await fetch('https://online-compiler-1-5f6k.onrender.com/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeToSend, language: language, prompt: prompt })
                });
                
                // If it's a JSON response (like an error), catch it
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const data = await response.json();
                    if (data.error) {
                        responseDiv.innerHTML = '<span style="color: #ff3864;">Error: ' + data.error + '</span>';
                        return;
                    }
                }

                // Streaming Response Reader
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let accumulatedText = "";
                responseDiv.innerHTML = ""; // clear thinking

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    accumulatedText += chunk;
                    
                    // Render dynamically using marked.js
                    if (typeof marked !== 'undefined') {
                        responseDiv.innerHTML = marked.parse(accumulatedText);
                    } else {
                        responseDiv.innerText = accumulatedText;
                    }
                    responseDiv.scrollTop = responseDiv.scrollHeight; // Auto-scroll to bottom
                }
            } catch (err) {
                responseDiv.innerHTML = '<span style="color: #ff3864;">Failed to connect to the backend API. Please make sure the server is online!</span>';
            }
        }
    </script>
