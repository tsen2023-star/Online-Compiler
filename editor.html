
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor - CodeCompiler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

    <style>
        /* Home Button Style */
        #home-btn {
            background: linear-gradient(45deg, #621b91, #232f96);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #home-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(157, 0, 255, 0.8), 0 0 30px rgba(157, 0, 255, 0.35);
        }

        /* NEW: Download Button Style */
        #download-btn {
            background: linear-gradient(45deg, #8f28b8, #0072ff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-left: 10px;
        }
        #download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(157, 0, 255, 0.8), 0 0 30px rgba(157, 0, 255, 0.35);
        }

        /* Clear Button Header Styles */
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 15px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }
        
        .clear-btn {
            background: linear-gradient(45deg, #804ea1, #a70da1);
            color: #ccc;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: #be0e0e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><span>&lt;/&gt;</span> Code Compiler</div>
        <div class="header-actions">
            <button id="home-btn" onclick="window.location.href='index.html'">← Home</button>
        </div>
    </div>

    <div class="language-tabs">
        <button class="lang-tab" data-lang="python" onclick="switchLanguage('python')">Python</button>
        <button class="lang-tab" data-lang="cpp" onclick="switchLanguage('cpp')">C++</button>
        <button class="lang-tab" data-lang="java" onclick="switchLanguage('java')">Java</button>
        <button class="lang-tab" data-lang="c" onclick="switchLanguage('c')">C</button>
        <button class="lang-tab" data-lang="html" onclick="switchLanguage('html')">HTML</button>
        <button class="lang-tab" data-lang="css" onclick="switchLanguage('css')">CSS</button>
    </div>

    <div class="main-container">
        <div class="editor-section">
            <div class="toolbar">
                <button class="run-btn" onclick="submitCode()">▶ Run</button>
                <button id="download-btn" onclick="downloadCode()">⬇ Download</button>
                <button id="ai-btn" class="run-btn" onclick="askAI()" style="margin-left: 10px; background: linear-gradient(90deg, #ff007f, #7f00ff);">✨ Ask AI</button>
            </div>
            <textarea id="code-editor" spellcheck="false" placeholder="Write your code here..."></textarea>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span class="output-title">Output Terminal</span>
                <button class="clear-btn" onclick="clearOutput()">Clear</button>
            </div>
            <div id="terminal-container" style="height: 100%; width: 100%; padding: 10px; background: #2b2b2b;"></div>
        </div>
    </div>

    <script>
        var currentLang = 'python';
        var starterCode = {
            python: 'name = input("Enter your name: ")\nprint("Hello, " + name + "!")',
            cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    string name;\n    cout << "Enter your name: ";\n    cin >> name;\n    cout << "Hello, " << name << "!" << endl;\n    return 0;\n}',
            java: 'import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print("Enter your name: ");\n        String name = sc.nextLine();\n        System.out.println("Hello, " + name + "!");\n    }\n}',
            c: '#include <stdio.h>\n\nint main() {\n    char name[50];\n    printf("Enter your name: ");\n    scanf("%s", name);\n    printf("Hello, %s!\\n", name);\n    return 0;\n}',
            html: '<h1>My Website</h1>\n<p>Rendered in browser.</p>',
            css: 'body { background-color: #222; color: white; }'
        };

        var term = new Terminal({
            theme: { background: '#000000' },
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'Consolas, "Courier New", monospace'
        });
        var fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();
        term.write('Terminal ready. Write code and click Run...\r\n');

        var ws = null;
        var inputBuffer = '';

        function clearOutput() {
            term.clear();
            term.write('\x1bc'); 
            term.write('Terminal cleared.\r\n');
        }

        term.onData(data => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (data === '\r') {
                    term.write('\r\n');
                    ws.send(inputBuffer + '\n');
                    inputBuffer = '';
                } else if (data === '\u007f') {
                    if (inputBuffer.length > 0) {
                        inputBuffer = inputBuffer.slice(0, -1);
                        term.write('\b \b');
                    }
                } else {
                    inputBuffer += data;
                    term.write(data);
                }
            }
        });

        function switchLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('selectedLanguage', lang);
            document.querySelectorAll('.lang-tab').forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
            document.getElementById('code-editor').value = starterCode[lang];
        }

        function submitCode() {
            const code = document.getElementById('code-editor').value;

            if (currentLang === 'html' || currentLang === 'css') {
                let preview = window.open("", "Preview", "width=800,height=600");
                preview.document.open();
                preview.document.write(currentLang === 'html' ? code : `<style>${code}</style><h1>Styles Applied</h1>`);
                preview.document.close();
                
                term.clear();
                term.write('\x1bc');
                term.write('Preview opened in a new window.\r\n');
                return;
            }

            term.clear();
            term.write('\x1bc'); 
            term.write('Connecting to server...\r\n');
            inputBuffer = '';

            if (ws) { ws.close(); }
            
ws = new WebSocket("wss://online-compiler-1-5f6k.onrender.com/ws/run");

            ws.onopen = () => {
                ws.send(JSON.stringify({ language: currentLang, code: code }));
            };

            ws.onmessage = (event) => {
                term.write(event.data);
            };

            ws.onerror = () => {
                term.write('\r\nConnection error. Is the backend running?\r\n');
            };
        }

        function downloadCode() {
            const ext = {python:'py', cpp:'cpp', java:'java', c:'c', html:'html', css:'css'}[currentLang];
            const blob = new Blob([document.getElementById('code-editor').value], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `code.${ext}`;
            a.click();
        }

        window.addEventListener('resize', () => { fitAddon.fit(); });
        window.onload = () => switchLanguage(localStorage.getItem('selectedLanguage') || 'python');
    </script>
    <!-- AI Modal -->
    <div id="ai-modal" style="display: none; position: fixed; bottom: 20px; right: 20px; width: 450px; max-height: 80vh; background: #111725; border: 1px solid #9d00ff; border-radius: 10px; box-shadow: 0 0 20px rgba(157, 0, 255, 0.4); color: white; flex-direction: column; z-index: 1000; overflow: hidden; resize: both;">
        <div id="ai-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #263449; padding: 12px 15px; background: linear-gradient(90deg, #1e2532, #111725); cursor: grab;">
            <h3 style="margin: 0; color: #00f5ff; font-size: 16px; text-shadow: 0 0 8px rgba(0, 245, 255, 0.6); pointer-events: none;">? AI Code Assistant</h3>
            <button onclick="document.getElementById('ai-modal').style.display='none'" style="background: transparent; border: none; color: white; font-size: 16px; cursor: pointer;">?</button>
        </div>
        <div id="ai-response" style="flex: 1; overflow-y: auto; padding: 15px; font-family: \'Segoe UI\', Tahoma, sans-serif; line-height: 1.5; font-size: 14px;">
            How can I help you with your code today?
        </div>
        <div style="padding: 15px; border-top: 1px solid #263449; background: #0b0f19;">
            <textarea id="ai-prompt" placeholder="Ask AI to write code, find errors, or explain concepts..." style="width: 100%; height: 60px; background: #1e2532; border: 1px solid #3d4b63; border-radius: 6px; color: white; padding: 10px; box-sizing: border-box; font-family: inherit; resize: none; margin-bottom: 10px;"></textarea>
            <div style="display: flex; justify-content: flex-end;">
                <button class="run-btn" onclick="sendToAI()" style="padding: 6px 15px; font-size: 13px;">Send ??</button>
            </div>
        </div>
    </div>

    <script>
        // Make the AI modal draggable
        dragElement(document.getElementById("ai-modal"));
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            if (document.getElementById("ai-header")) {
                document.getElementById("ai-header").onmousedown = dragMouseDown;
            } else {
                elmnt.onmousedown = dragMouseDown;
            }
            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.bottom = "auto";
                elmnt.style.right = "auto";
            }
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // Open the modal when clicking toolbar button
        function askAI() {
            document.getElementById('ai-modal').style.display = 'flex';
            if (document.getElementById('ai-response').innerText.includes("How can I help you")) {
                document.getElementById('ai-prompt').focus();
            }
        }

        async function sendToAI() {
            const code = document.getElementById('code-editor').value;
            const prompt = document.getElementById('ai-prompt').value;
            const language = localStorage.getItem('selectedLanguage') || 'python';
            const responseDiv = document.getElementById('ai-response');
            
            if (!code.trim() && !prompt.trim()) {
                alert("Please provide some code in the editor or type a question!");
                return;
            }

            responseDiv.innerHTML = '<span style="color: #9d00ff;">Thinking... ?</span>';
            document.getElementById('ai-prompt').value = ''; // clear input

            try {
                const response = await fetch('http://127.0.0.1:8000/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, language: language, prompt: prompt })
                });
                
                const data = await response.json();
                if (data.error) {
                    responseDiv.innerHTML = '<span style="color: #ff3864;">Error: ' + data.error + '</span>';
                } else {
                    let formatted = data.feedback;
                    formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #00f5ff;"></strong>');
                    
                    formatted = formatted.replace(/`(\w+)?\n([\s\S]*?)`/g, function(match, lang, code) {
                        const safeCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        const encodedCode = encodeURIComponent(code);
                        return                         <div style="background: #1e2532; border-radius: 8px; margin: 15px 0; border: 1px solid #3d4b63; overflow: hidden;">
                            <div style="background: #111725; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d4b63;">
                                <span style="color: #a8b2c1; font-size: 13px; font-weight: bold;">&lt;/&gt; \</span>
                                <div>
                                    <button onclick="navigator.clipboard.writeText(decodeURIComponent(''))" style="background: transparent; border: 1px solid #a8b2c1; color: white; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; margin-right: 5px; transition: 0.2s;">?? Copy</button>
                                    <button onclick="document.getElementById('code-editor').value=decodeURIComponent('');" style="background: linear-gradient(90deg, #9d00ff, #2962ff); border: none; color: white; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 12px; font-weight: bold;">? Insert</button>
                                </div>
                            </div>
                            <pre style="margin: 0; padding: 15px; color: #00f5ff; font-family: 'Consolas', monospace; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;"><code>\</code></pre>
                        </div>\;
                    });
                    
                    responseDiv.innerHTML = formatted;
                }
            } catch (err) {
                responseDiv.innerHTML = '<span style="color: #ff3864;">Failed to connect to the backend API. Make sure your Python server is running!</span>';
            }
        }
    </script>
</body>
</html>
