
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor - CodeCompiler</title>
    <link rel="stylesheet" href="style.css?v=drag_and_leak_fix">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

    <style>
        /* Home Button Style */
        #home-btn {
            background: linear-gradient(45deg, #621b91, #232f96);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #home-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(157, 0, 255, 0.8), 0 0 30px rgba(157, 0, 255, 0.35);
        }

        /* NEW: Download Button Style */
        #download-btn {
            background: linear-gradient(45deg, #8f28b8, #0072ff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-left: 10px;
        }
        #download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(157, 0, 255, 0.8), 0 0 30px rgba(157, 0, 255, 0.35);
        }

        /* Clear Button Header Styles */
        
        
        .clear-btn {
            background: linear-gradient(45deg, #804ea1, #a70da1);
            color: #ccc;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .clear-btn:hover {
            background: linear-gradient(45deg, #be0e0e, #ff3333);
            color: white;
            box-shadow: 0 0 12px rgba(190, 14, 14, 0.7);
            transform: scale(1.05);
        }
    </style>

    <!-- CodeMirror for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <!-- Marked.js for streaming markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        .CodeMirror { height: 100%; font-family: 'Consolas', monospace; font-size: 14px; border-radius: 8px; }
      .cm-s-monokai.CodeMirror { background-color: #0b0f19 !important; }
      .cm-s-monokai .CodeMirror-gutters { background-color: #0b0f19 !important; border-right: 1px solid #1e2532 !important; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><span>&lt;/&gt;</span> Code Compiler</div>
        <div class="header-actions" style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
            <button id="home-btn" onclick="window.location.href='index.html'">Home</button>
            
        </div>
    </div>

    <div class="language-tabs">
        <button class="lang-tab" data-lang="python" onclick="switchLanguage('python')">Python</button>
        <button class="lang-tab" data-lang="cpp" onclick="switchLanguage('cpp')">C++</button>
        <button class="lang-tab" data-lang="java" onclick="switchLanguage('java')">Java</button>
        <button class="lang-tab" data-lang="c" onclick="switchLanguage('c')">C</button>
        <button class="lang-tab" data-lang="html" onclick="switchLanguage('html')">HTML</button>
        <button class="lang-tab" data-lang="css" onclick="switchLanguage('css')">CSS</button>
    
        <div style="margin-left: auto; display: flex; align-items: center; padding-right: 15px;">
            <label class="theme-switch" for="theme-checkbox">
                <input type="checkbox" id="theme-checkbox" onchange="toggleTheme()">
                <div class="theme-slider">
                    <span class="theme-text theme-text-left">DARK<br>MODE</span>
                    <span class="theme-text theme-text-right">LIGHT<br>MODE</span>
                    <div class="theme-thumb">
                        <span class="theme-icon theme-icon-moon">🌙</span>
                        <span class="theme-icon theme-icon-sun">☀️</span>
                    </div>
                </div>
            </label>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-section">
            <div class="toolbar">
                <button class="run-btn" id="run-btn" onclick="runCode()">▶ Run</button>                <button id="download-btn" onclick="downloadCode()">⬇ Download</button>
                <button id="ai-btn" class="run-btn" onclick="askAI()" style="margin-left: 10px; background: linear-gradient(90deg, #ff007f, #7f00ff);">✨ Ask AI</button>
            </div>
            <textarea id="code-editor" spellcheck="false" placeholder="Write your code here..."></textarea>
        </div>

        <div class="resizer" id="resizer"><div style="height: 56px; border-bottom: 1px solid var(--border); box-sizing: border-box; width: 100%;"></div></div>
        <div class="output-section">
            <div class="output-header">
                <span class="output-title" style="font-weight: 600; font-size: 14px; color: var(--cyan);">Output Terminal</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="run-btn" id="stop-btn" onclick="stopExecution()" style="display: none; background: linear-gradient(90deg, #ff3333, #be0e0e); box-shadow: 0 0 12px rgba(255, 51, 51, 0.6); padding: 8px 16px; font-size: 13px;">Stop ⏹️</button>
                    <button class="clear-btn" onclick="clearOutput()" style="padding: 8px 16px; font-size: 13px;">Clear</button>
                </div>
            </div>
            <div id="terminal-container" style="height: 100%; width: 100%; padding: 10px 0 10px 10px; background: transparent;"></div>
        </div>
    </div>

    
    <!-- AI Modal -->
    <div id="ai-modal" style="display: none; position: fixed; bottom: 20px; right: 20px; width: 450px; max-height: 80vh; background: #111725; border: 1px solid #9d00ff; border-radius: 10px; box-shadow: 0 0 20px rgba(157, 0, 255, 0.4); color: white; flex-direction: column; z-index: 1000; overflow: hidden; resize: both;">
        <div id="ai-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #263449; padding: 12px 15px; background: linear-gradient(90deg, #1e2532, #111725); cursor: grab;">
            <h3 style="margin: 0; color: #00f5ff; font-size: 16px; text-shadow: 0 0 8px rgba(0, 245, 255, 0.6); pointer-events: none;">✨ AI Code Assistant</h3>
            <button id="ai-close-btn" onclick="document.getElementById('ai-modal').style.display='none'" style="background: transparent; border: none; color: white; font-size: 16px; cursor: pointer;">✖</button>
        </div>
        
        <div id="ai-response" style="flex: 1; overflow-y: auto; padding: 15px; font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.5; font-size: 14px;">
            How can I help you with your code today?
        </div>
        
        <!-- Context Attachment UI (Card Format) -->
        <div id="ai-attachment-container" style="padding: 10px 15px 0 15px; background: #0b0f19; display: none;">
            <div id="ai-attached-file" style="position: relative; width: 90px; height: 90px; background: #2a2a2a; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <img id="ai-attachment-icon" src="" style="width: 24px; height: 24px; border-radius: 4px;" alt="Language Icon">
                    <button onclick="removeAttachment()" style="background: white; color: black; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; line-height: 1;">✖</button>
                </div>
                <div id="ai-attachment-text" style="color: white; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Segoe UI', Tahoma, sans-serif;">code.py</div>
            </div>
        </div>

        <div id="ai-input-container" style="padding: 15px; background: #0b0f19;">
            <textarea id="ai-prompt" placeholder="Ask AI to write code, find errors, or explain concepts..." style="width: 100%; height: 60px; background: #1e2532; border: 1px solid #3d4b63; border-radius: 6px; color: white; padding: 10px; box-sizing: border-box; font-family: inherit; resize: none; margin-bottom: 10px;"></textarea>
            <div style="display: flex; justify-content: flex-end;">
                <button class="run-btn" onclick="sendToAI()" style="padding: 6px 15px; font-size: 13px;">Send 🚀</button>
            </div>
        </div>
    </div>
<script>
        
        
        // --- Resizer Logic ---
        const resizer = document.getElementById('resizer');
        const leftSide = document.querySelector('.editor-section');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none'; // Prevent text selection
            leftSide.style.pointerEvents = 'none'; // Prevent iframe/editor from stealing mouse events
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerOffsetLeft = leftSide.parentElement.offsetLeft;
            const pointerRelativeXpos = e.clientX - containerOffsetLeft;
            const containerWidth = leftSide.parentElement.clientWidth;
            
            const minWidth = 50; // minimum width
            if (pointerRelativeXpos > minWidth && pointerRelativeXpos < containerWidth - minWidth) {
                leftSide.style.flex = 'none';
                leftSide.style.width = pointerRelativeXpos + 'px';
                if (typeof fitAddon !== 'undefined') {
                    fitAddon.fit();
                }
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                document.body.style.userSelect = ''; // Restore text selection
                leftSide.style.pointerEvents = 'auto';
                if (typeof fitAddon !== 'undefined') {
                    fitAddon.fit();
                }
            }
        });

        // --- Theme Logic ---
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeUI(isLight);
        }

        function updateThemeUI(isLight) {
            const checkbox = document.getElementById('theme-checkbox');
            if (checkbox) checkbox.checked = isLight;
            
            // Update CodeMirror
            editor.setOption('theme', isLight ? 'default' : 'monokai');
            
            // Update Terminal
            term.options.theme = isLight 
                ? { background: '#ffffff', foreground: '#1e293b', cursor: '#1e293b' } 
                : { background: '#000000', foreground: '#ffffff', cursor: '#ffffff' };
        }

        // Initialize Theme on Load
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            // We call updateThemeUI(true) slightly later because term/editor might not be fully ready here
            setTimeout(() => updateThemeUI(true), 50);
        }
        
        // --- CodeMirror Initialization ---
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            lineNumbers: true,
            mode: 'python',
            theme: 'monokai',
            autoCloseBrackets: true
        });

        const langModes = {
            python: 'python',
            cpp: 'text/x-c++src',
            c: 'text/x-csrc',
            java: 'text/x-java',
            html: 'xml',
            css: 'css'
        };

        const defaultCode = {
            python: "print('Hello, World!')",
            cpp: "#include <iostream>\n\nint main() {\n    std::cout << \"Hello, World!\";\n    return 0;\n}",
            c: "#include <stdio.h>\n\nint main() {\n    printf(\"Hello, World!\");\n    return 0;\n}",
            java: "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    }\n}",
            html: "<!DOCTYPE html>\n<html>\n<head>\n    <title>Test</title>\n</head>\n<body>\n    <h1>Hello World</h1>\n</body>\n</html>",
            css: "body {\n    background-color: #2b2b2b;\n    color: white;\n}"
        };

        const languageNames = {
            python: 'Python', cpp: 'C++', c: 'C', java: 'Java', html: 'HTML', css: 'CSS'
        };

        function switchLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            
            
            // Highlight active tab
            document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.querySelector(`.lang-tab[data-lang="${lang}"]`);
            if (activeTab) activeTab.classList.add('active');
            
            // Set Mode
            editor.setOption('mode', langModes[lang]);

            // Try to load saved code from local storage
            const savedCode = localStorage.getItem('code_' + lang);
            if (savedCode) {
                editor.setValue(savedCode);
            } else {
                editor.setValue(defaultCode[lang] || "");
            }
        }

        // Auto-save feature
        editor.on('change', () => {
            const lang = localStorage.getItem('selectedLanguage') || 'python';
            localStorage.setItem('code_' + lang, editor.getValue());
        });

        // Initialize on load
        const savedLang = localStorage.getItem('selectedLanguage') || 'python';
        switchLanguage(savedLang);

        // --- Terminal Initialization ---
        const term = new Terminal({
            theme: { background: '#000000' },
            fontFamily: 'Consolas, monospace',
            fontSize: 14,
            cursorBlink: true
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        let currentWs = null;

        function runCode() {
            if (currentWs) return; // already running

            const lang = localStorage.getItem('selectedLanguage') || 'python';
            const code = editor.getValue();
            
            term.clear();
            term.write('\x1b[36mConnecting to server...\x1b[0m\r\n');
            
            // Toggle Buttons
            
            document.getElementById('stop-btn').style.display = 'inline-block';

            const ws = new WebSocket('wss://online-compiler-1-5f6k.onrender.com/ws/run');
            currentWs = ws;

            ws.onopen = () => {
                ws.send(JSON.stringify({ language: lang, code: code }));
            };

            ws.onmessage = (event) => {
                term.write(event.data);
            };

            ws.onclose = () => {
                term.write('\r\n\x1b[33mConnection closed.\x1b[0m\r\n');
                currentWs = null;
                
                document.getElementById('stop-btn').style.display = 'none';
            };

            ws.onerror = (err) => {
                term.write('\r\n\x1b[31mWebSocket Error.\x1b[0m\r\n');
            };

            term.onData((data) => {
                if (currentWs && currentWs.readyState === WebSocket.OPEN) {
                    currentWs.send(data);
                }
            });
        }

        function stopExecution() {
            if (currentWs && currentWs.readyState === WebSocket.OPEN) {
                currentWs.send('{"command": "stop"}');
            }
        }

        function clearOutput() {
            term.clear();
            term.write('Terminal cleared.\r\n');
        }

        function downloadCode() {
            const lang = localStorage.getItem('selectedLanguage') || 'python';
            const ext = {python:'py', cpp:'cpp', java:'java', c:'c', html:'html', css:'css'}[lang] || 'txt';
            const blob = new Blob([editor.getValue()], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `code.${ext}`;
            a.click();
        }

        window.addEventListener('resize', () => {
            fitAddon.fit();
        });
        
        // --- AI Assistant Logic ---
        
        dragElement(document.getElementById("ai-modal"));
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            if (document.getElementById("ai-header")) {
                document.getElementById("ai-header").onmousedown = dragMouseDown;
            } else {
                elmnt.onmousedown = dragMouseDown;
            }
            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.bottom = "auto";
                elmnt.style.right = "auto";
            }
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        let attachedCodeContext = "";

        function askAI() {
            document.getElementById('ai-modal').style.display = 'flex';
            
            const selectedText = editor.getSelection();
            const attachContainer = document.getElementById('ai-attachment-container');
            const attachText = document.getElementById('ai-attachment-text');
            const iconImg = document.getElementById('ai-attachment-icon');
            
            const language = localStorage.getItem('selectedLanguage') || 'python';
            const ext = {python:'py', cpp:'cpp', java:'java', c:'c', html:'html', css:'css'}[language] || 'txt';
            
            const iconMap = {
                python: 'python/python-original.svg',
                java: 'java/java-original.svg',
                cpp: 'cplusplus/cplusplus-original.svg',
                c: 'c/c-original.svg',
                html: 'html5/html5-original.svg',
                css: 'css3/css3-original.svg'
            };
            const iconPath = iconMap[language] || 'javascript/javascript-original.svg';
            if (iconImg) iconImg.src = `https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/${iconPath}`;

            if (selectedText.trim()) {
                attachedCodeContext = selectedText;
                attachText.innerText = "code." + ext;
                attachContainer.style.display = 'block';
            } else if (editor.getValue().trim()) {
                attachedCodeContext = editor.getValue();
                attachText.innerText = "code." + ext;
                attachContainer.style.display = 'block';
            } else {
                attachedCodeContext = "";
                attachContainer.style.display = 'none';
            }

            if (document.getElementById('ai-response').innerText.includes("How can I help you")) {
                document.getElementById('ai-prompt').focus();
            }
        }

        function removeAttachment() {
            attachedCodeContext = "";
            document.getElementById('ai-attachment-container').style.display = 'none';
        }

        // Configure Marked.js with custom renderer for copying code
        if (typeof marked !== 'undefined') {
            const renderer = new marked.Renderer();
            renderer.code = function({text, lang}) {
                const encodedCode = encodeURIComponent(text);
                const safeCode = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<div style="background: #1e2532; border-radius: 8px; margin: 15px 0; border: 1px solid #3d4b63; overflow: hidden;">
                           <div style="background: #111725; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d4b63;">
                           <span style="color: #a8b2c1; font-size: 13px; font-weight: bold;">&lt;/&gt; ${lang || 'Code'}</span>
                           <div>
                           <button class="ai-copy-btn" onclick="navigator.clipboard.writeText(decodeURIComponent('${encodedCode}'))">📋 Copy</button>
                           <button class="ai-insert-btn" onclick="editor.replaceSelection(decodeURIComponent('${encodedCode}')); document.getElementById('ai-modal').style.display='none';">▶ Insert</button>
                           </div></div>
                           <pre style="margin: 0; padding: 15px; color: #00f5ff; font-family: 'Consolas', monospace; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;"><code>${safeCode}</code></pre>
                        </div>`;
            };
            marked.use({ renderer });
        }

        async function sendToAI() {
            const prompt = document.getElementById('ai-prompt').value;
            const language = localStorage.getItem('selectedLanguage') || 'python';
            const responseDiv = document.getElementById('ai-response');
            
            if (!attachedCodeContext.trim() && !prompt.trim()) {
                alert("Please provide some code in the editor or type a question!");
                return;
            }

            responseDiv.innerHTML = '<span style="color: #9d00ff;">Thinking... ⏳</span>';
            document.getElementById('ai-prompt').value = '';
            
            const codeToSend = attachedCodeContext;
            document.getElementById('ai-attachment-container').style.display = 'none';
            attachedCodeContext = "";

            try {
                const response = await fetch('https://online-compiler-1-5f6k.onrender.com/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeToSend, language: language, prompt: prompt })
                });
                
                // If it's a JSON response (like an error), catch it
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const data = await response.json();
                    if (data.error) {
                        responseDiv.innerHTML = '<span style="color: #ff3864;">Error: ' + data.error + '</span>';
                        return;
                    }
                }

                // Streaming Response Reader
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let accumulatedText = "";
                responseDiv.innerHTML = ""; // clear thinking

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    accumulatedText += chunk;
                    
                    // Render dynamically using marked.js
                    if (typeof marked !== 'undefined') {
                        responseDiv.innerHTML = marked.parse(accumulatedText);
                    } else {
                        responseDiv.innerText = accumulatedText;
                    }
                    responseDiv.scrollTop = responseDiv.scrollHeight; // Auto-scroll to bottom
                }
            } catch (err) {
                responseDiv.innerHTML = '<span style="color: #ff3864;">Failed to connect to the backend API. Please make sure the server is online!</span>';
            }
        }
    </script>
</body>
</html>
